name: Waiver board

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Score the board
        env:
          FPL_LEAGUE: ${{ vars.FPL_LEAGUE }}
          FPL_ENTRY: ${{ vars.FPL_ENTRY }}
        run: |
          if [ -z "$FPL_LEAGUE" ] || [ -z "$FPL_ENTRY" ]; then
            echo "::error::Set the repository variables FPL_LEAGUE and FPL_ENTRY (Settings -> Secrets and variables -> Actions -> Variables)."
            exit 1
          fi
          python draft.py --refresh publish --out site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
